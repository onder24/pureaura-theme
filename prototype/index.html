<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>PureAura – Entwurf</title>
  <style>
    :root { --bg: #f4f1ec; --fg: #0a0a0a; --muted: #6b665f; }
    * { box-sizing: border-box; margin: 0; }
    body {
      min-height: 100vh; display: grid; place-items: center; padding: 24px;
      background: var(--bg); color: var(--fg);
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    main { max-width: 420px; text-align: center; }
    img { width: 140px; height: auto; margin-bottom: 32px; }
    h1 { font-size: 28px; font-weight: 500; letter-spacing: 0.02em; }
    p { margin-top: 12px; color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <img src="assets/flakon-classic.png" alt="">
    <h1>PureAura</h1>
    <p>Neuer Entwurf in Arbeit. Diese Seite wird bei jedem Push automatisch aktualisiert.</p>
  </main>
</body>
</html>
